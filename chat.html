<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Library Chatbot</title>
  <link rel="stylesheet" href="chat.css">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; font-family: sans-serif; }
    #sidebar { border-right:1px solid #ccc; }
    #messages p { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>Library Chatbot</h1>



  <hr>

  <!-- Chat kiểu ChatGPT -->
  <div style="display:flex; height:70vh; border:1px solid #ddd; margin-top:10px;">
    <!-- Sidebar -->
    <div id="sidebar" style="width:250px; background:#f3f3f3; padding:10px; overflow-y:auto;">
      <button onclick="newChat()">+ New Chat</button>
      <ul id="chatList"></ul>
    </div>

    <!-- Chat window -->
    <div style="flex:1; display:flex; flex-direction:column;">
      <div id="messages" style="flex:1; padding:10px; overflow-y:auto; background:#fff;"></div>
      <div style="padding:10px; display:flex; gap:5px;">
        <input id="msg" placeholder="Nhập câu hỏi..." style="flex:1;">
        <button onclick="sendMessage()">Gửi</button>
      </div>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
