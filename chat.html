<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Library Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; }
    #log { border: 1px solid #ddd; padding: 12px; height: 360px; overflow-y: auto; border-radius: 8px; }
    .me { color: #1976d2; margin: 6px 0; }
    .bot { color: #2e7d32; margin: 6px 0; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 16px; border: 0; background: #1976d2; color: white; border-radius: 6px; cursor: pointer; }
    button:hover { opacity: .9; }
  </style>
</head>
<body>
  <h1>Library Chatbot</h1>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="Nhập câu hỏi..." autocomplete="off" />
    <button>Gửi</button>
  </form>

  <script>
    // Nếu đổi cổng API, sửa ở đây
    const API = "http://127.0.0.1:8000/chat";

    const log = document.getElementById("log");
    const f = document.getElementById("f");
    const q = document.getElementById("q");

    function line(text, cls) {
      const div = document.createElement("div");
      div.className = cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = q.value.trim();
      if (!question) return;
      line("You: " + question, "me");
      q.value = "";
      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        line("Bot: " + (data.answer ?? JSON.stringify(data)), "bot");
      } catch (err) {
        line("Lỗi gọi API: " + err, "bot");
      }
    });
  </script>
</body>
</html>
