<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Library Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; }
    #log { border: 1px solid #ddd; padding: 12px; height: 360px; overflow-y: auto; border-radius: 8px; background: #fafafa; }
    .me { color: #1976d2; margin: 6px 0; }
    .bot { color: #2e7d32; margin: 6px 0; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 16px; border: 0; background: #1976d2; color: white; border-radius: 6px; cursor: pointer; }
    button:hover { opacity: .9; }

    table { border-collapse: collapse; margin-top: 6px; width: 100%; }
    table, th, td { border: 1px solid #ccc; }
    th, td { padding: 6px 8px; text-align: left; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Library Chatbot</h1>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="Nhập câu hỏi..." autocomplete="off" />
    <button>Gửi</button>
  </form>

  <script>
  const API = "http://127.0.0.1:3000/chat";
  const log = document.getElementById("log");
  const f = document.getElementById("f");
  const q = document.getElementById("q");

  function line(text, cls, isHTML=false) {
    const div = document.createElement("div");
    div.className = cls;
    if (isHTML) {
      div.innerHTML = text; // cho phép render HTML
    } else {
      div.textContent = text;
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function renderTable(rows) {
    if (!rows || rows.length === 0) return "<i>Không tìm thấy dữ liệu</i>";

    let html = "<table><thead><tr>";
    Object.keys(rows[0]).forEach(col => {
      html += `<th>${col}</th>`;
    });
    html += "</tr></thead><tbody>";
    rows.forEach(row => {
      html += "<tr>";
      Object.values(row).forEach(val => {
        html += `<td>${val}</td>`;
      });
      html += "</tr>";
    });
    html += "</tbody></table>";
    return html;
  }

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = q.value.trim();
    if (!question) return;
    line("You: " + question, "me");
    q.value = "";

    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        const text = await res.text();
        line(`Lỗi API: HTTP ${res.status} ${res.statusText} - ${text}`, "bot");
        return;
      }

      const data = await res.json();

      // Nếu server trả về dữ liệu dạng bảng (array object) thì render bảng
      if (Array.isArray(data.answer)) {
        const table = renderTable(data.answer);
        line("Bot:<br>" + table, "bot", true);
      } else if (typeof data.answer === "string" && data.answer.includes("<table")) {
        // Nếu server đã trả sẵn HTML bảng
        line("Bot:<br>" + data.answer, "bot", true);
      } else {
        line("Bot: " + (data.answer ?? JSON.stringify(data)), "bot");
      }
    } catch (err) {
      line("Lỗi gọi API: " + err, "bot");
    }
  });
</script>

</body>
</html>
